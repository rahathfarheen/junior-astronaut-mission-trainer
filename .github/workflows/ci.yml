name: CI and GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
        continue-on-error: true
      - id: app_build
        run: npm run build
        continue-on-error: true
      - name: Prepare the demo fallback if the app build is unavailable
        if: always() && (steps.dependencies.outcome == 'failure' || steps.app_build.outcome == 'failure')
        run: |
          rm -rf dist
          mkdir -p dist
          cp public/demo-fallback.html dist/index.html
          cp public/manifest.webmanifest public/icon.svg public/sw.js dist/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
