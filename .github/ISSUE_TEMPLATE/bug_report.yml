name: Bug report
description: Report a problem in a mission or the dashboard
body:
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
